name: Publish DB dump

# Importe le RPPS dans un PostgreSQL éphémère (ici, sur un runner puissant) et publie le résultat
# sous forme de dump dans la release `data-latest`. Le Raspberry Pi n'a plus qu'à le restaurer
# (scripts/pi_update_db.sh) au lieu de tout importer lui-même, ce qui saturerait sa carte SD.
on:
  schedule:
    - cron: "30 5 * * *" # 30 min après update-rpps.yml (5h UTC)
  workflow_dispatch:

permissions:
  contents: write # release data-latest

jobs:
  dump:
    name: Import et dump
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: absante
          POSTGRES_PASSWORD: absante
          POSTGRES_DB: absante
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U absante -d absante"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Télécharge les trois fichiers RPPS (libre accès, data.gouv.fr)
        run: |
          mkdir -p data
          dl() { curl -fL --retry 4 --retry-delay 15 -o "data/$2" "https://www.data.gouv.fr/api/1/datasets/r/$1"; }
          dl fffda7e9-0ea2-4c35-bba0-4496f3af935d PS_LibreAcces_Personne_activite.txt
          dl 41ae70ac-90c8-4c4e-8644-4ef1b100f045 PS_LibreAcces_Dipl_AutExerc.txt
          dl fb55f15f-bd61-4402-b551-51ef387f2fab PS_LibreAcces_SavoirFaire.txt
          ls -lh data

      # Le schéma s'appelle rpps_next : sur le Pi il est restauré à côté du schéma en service puis
      # basculé par renommage, sans jamais toucher aux données servies pendant la restauration.
      # L'import refuse un fichier tronqué (moins d'un million d'activités).
      - name: Importe dans PostgreSQL
        working-directory: api
        env:
          DATABASE_URL: postgres://absante:absante@localhost:54329/absante
          DB_SCHEMA: rpps_next
        run: npm run import:rpps -- --dir ../data

      # Effectifs du jour, tirés du fichier de la carte (mêmes chiffres), rangés dans la table
      # effectifs_snapshot : le Pi les recopie dans son historique mensuel. Secondaire, donc un
      # échec ne bloque pas la publication du dump (la table reste vide).
      - name: Effectifs du jour pour l'historique
        continue-on-error: true
        run: |
          python3 scripts/snapshot_effectifs.py --out effectifs.csv
          PGPASSWORD=absante psql -h localhost -p 54329 -U absante -d absante -v ON_ERROR_STOP=1 \
            -c "\copy rpps_next.effectifs_snapshot (date_donnees, departement, profession, specialite, n) FROM 'effectifs.csv' WITH (FORMAT csv, HEADER true, FORCE_NOT_NULL (specialite))"

      - name: Dump
        run: |
          pg_dump --version
          PGPASSWORD=absante pg_dump -h localhost -p 54329 -U absante -d absante -n rpps_next -Fc -Z 6 -f rpps.dump
          PGPASSWORD=absante psql -h localhost -p 54329 -U absante -d absante -At -c "select valeur from rpps_next.meta where cle='updated_at'" > updated_at.txt
          SHA="$(sha256sum rpps.dump | cut -d' ' -f1)"
          printf '{"sha256":"%s","bytes":%s,"updatedAt":"%s"}\n' "$SHA" "$(stat -c %s rpps.dump)" "$(cat updated_at.txt)" > rpps.dump.json
          cat rpps.dump.json; ls -lh rpps.dump

      - name: Publie dans la release data-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest \
            --title "Données RPPS (dump PostgreSQL)" --notes "Dump quotidien, voir rpps.dump.json." --latest=false
          gh release upload data-latest rpps.dump rpps.dump.json --clobber
          gh release edit data-latest --notes "Généré le $(date -u '+%Y-%m-%d %H:%M UTC') — $(cat rpps.dump.json)"
