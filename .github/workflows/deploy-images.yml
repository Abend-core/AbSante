name: Publish images

# Construit les images ARM du Raspberry Pi et les publie sur GHCR. Le Pi ne construit JAMAIS
# lui-même (son watchdog le redémarre quand la charge dépasse 10) : Watchtower y récupère
# simplement l'image publiée, comme pour les autres projets.
on:
  push:
    branches: [main]
    paths: ["api/**", "front/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            file: ./api/Dockerfile
          - name: front
            context: ./front
            file: ./front/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les étapes qui exécutent du code tournent sur le runner (--platform=$BUILDPLATFORM dans les
      # Dockerfiles) : seule l'image finale est arm64, sans émulation.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/abend-core/absante-${{ matrix.name }}:latest
            ghcr.io/abend-core/absante-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
