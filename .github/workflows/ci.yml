name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install (api)
        working-directory: api
        run: npm ci

      - name: Lint (api)
        working-directory: api
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    # L'API est testée contre un vrai Postgres (import RPPS, requêtes, pannes) : pas de mock de la base.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: absante
          POSTGRES_PASSWORD: absante
          POSTGRES_DB: absante
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U absante -d absante"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            api/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Install (api)
        working-directory: api
        run: npm ci

      - name: Typecheck (api)
        working-directory: api
        run: npm run typecheck

      - name: Test (api)
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://absante:absante@localhost:54329/absante
        run: npm run test:ci

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            api/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install (api)
        working-directory: api
        run: npm ci

      - name: Build (api)
        working-directory: api
        run: npm run build

  # Le déploiement en prod (sur push/merge vers main) sera ajouté une fois l'infra cible
  # prête (Raspberry Pi de l'utilisateur) et la pipeline + les fonctionnalités jugées
  # complètes — décision explicite, pas encore fait.
