server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers de données JSON (départements, communes, établissements) se compressent très
    # bien : c'est le gros de ce que télécharge la carte.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json application/geo+json;

    # L'API (Fastify) : résolue à chaque requête par le DNS de Docker, pour survivre à la
    # recréation du conteneur `api` (sans ça, nginx garderait son ancienne adresse IP).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3100;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Scripts et styles au nom haché : jamais modifiés, cache d'un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Le service worker et le manifeste doivent toujours être revalidés (sinon une nouvelle
    # version de l'application resterait bloquée derrière l'ancienne).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /offline.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Données mises à jour chaque jour : revalidées (ETag) à chaque chargement.
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Application monopage : toute autre route (ex: /praticien/810006881261) retombe sur index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
